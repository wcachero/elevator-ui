<h2>Elevator Control Panel</h2>

<div class="floors">
  <div *ngFor="let floor of floors" class="floor-row">
    <span [style.color]="isPending(floor) ? 'red' : 'black'">
      Floor {{ floor }}
    </span>
    <button (click)="request(floor, 'Up')" [disabled]="floor === 10">⬆️</button>
    <button (click)="request(floor, 'Down')" [disabled]="floor === 1">⬇️</button>
  </div>
</div>

<hr />

<h3>Elevator Status</h3>
<ul>
  <li *ngFor="let elevator of elevators">
    Elevator {{ elevator.id }} is on floor {{ elevator.currentFloor }} ({{ elevator.direction }})
  </li>
</ul>
